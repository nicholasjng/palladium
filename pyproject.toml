[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palladium"
version = "0.1.0"
description = "Pallas kernels on Apple GPU: trace Pallas, emit MSL, dispatch via metal-runtime"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11,<0.12",
    "metal-runtime",
]

[tool.uv.sources]
metal-runtime = { git = "https://github.com/nicholasjng/metal-runtime.git", rev = "ba943ee62b09a16ed859d6f3a2103579a8347eb6" }

[dependency-groups]
dev = [
    "diffrax>=0.6",
    "hypothesis>=6.100",
    "mew-bench>=0.1.0",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.66",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/palladium"]

[tool.mew]
benchpaths = ["benchmarks"]

[tool.pytest.ini_options]
markers = [
    "exercise: test-driven exercise, red until you implement the emitter rule it covers",
    "fuzz: differential fuzzing against the interpret oracle; GPU-bound and slow, run explicitly with -m fuzz",
]
addopts = '-m "not fuzz"'
testpaths = ["tests"]
