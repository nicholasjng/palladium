[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "palladium"
version = "0.1.0"
description = "Pallas kernels on Apple GPU: trace Pallas, emit MSL, dispatch via metal-runtime"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11,<0.12",
    "metal-runtime",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/palladium"]
cmake.version = ">=3.24"
cmake.build-type = "Release"

[tool.uv.sources]
metal-runtime = { path = "../metal-runtime" }

[dependency-groups]
build = [
    "scikit-build-core>=1.0",
]
dev = [
    "diffrax>=0.6",
    "hypothesis>=6.100",
    "mew-bench>=0.1.0",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.66",
    "typing-extensions>=4.10",
]

[tool.uv]
no-build-isolation-package = ["palladium"]
default-groups = ["build", "dev"]

[tool.mew]
benchpaths = ["benchmarks"]

[tool.pytest.ini_options]
markers = [
    "exercise: test-driven exercise, red until you implement the emitter rule it covers",
    "fuzz: differential fuzzing against the interpret oracle; GPU-bound and slow, run explicitly with -m fuzz",
]
addopts = '-m "not fuzz"'
testpaths = ["tests"]
